services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: pangchelin-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: '5L6g3nShT-eMCtK--X86sw'
    ports:
      - '9094:9094'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - pangchelin-network

  postgres:
    image: postgres:16-alpine
    container_name: pangchelin-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - pangchelin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pangchelin-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: pangchelin-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
      - apps/api/.env
    environment:
      CI: 'true'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: ${API_PORT:-4000}
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - .:/workspace
      - api_node_modules:/workspace/node_modules
      - api_app_node_modules:/workspace/apps/api/node_modules
    command: sh -c "pnpm install --frozen-lockfile --config.confirmModulesPurge=false && pnpm prisma generate && pnpm build && pnpm dev"
    networks:
      - pangchelin-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: pangchelin-web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
      - apps/web/.env
    environment:
      CI: 'true'
      PORT: ${WEB_PORT:-3000}
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
      INTERNAL_API_URL: http://api:${API_PORT:-4000}
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
      - web_app_node_modules:/workspace/apps/web/node_modules
      - web_next_cache:/workspace/apps/web/.next
    command: sh -c "pnpm install --frozen-lockfile --config.confirmModulesPurge=false && pnpm dev --hostname 0.0.0.0"
    networks:
      - pangchelin-network

volumes:
  pangchelin_postgres_data:
  api_node_modules:
  api_app_node_modules:
  web_node_modules:
  web_app_node_modules:
  web_next_cache:

networks:
  pangchelin-network:
    driver: bridge
